services:
  realmd:
    image: cmangos-${CMANGOS_EXPANSION:-wotlk}:latest
    pull_policy: never
    build:
      context: "docker"
      tags:
        - "cmangos-${CMANGOS_EXPANSION:-wotlk}:latest"
      dockerfile: Dockerfile
      args:
        - "PLAYERBOTS=${BUILD_PLAYERBOTS:-1}"
        - "AHBOT=${BUILD_PLAYERBOTS:-1}"
        - "CMANGOS_EXPANSION=${CMANGOS_EXPANSION:-wotlk}"
    env_file: .env
    ports:
      - 3724:3724
    volumes:
      - ./databases:/databases
      - /etc/localtime:/etc/localtime:ro
    entrypoint:
      - "/mangos/bin/realmd"
  mangosd:
    image: cmangos-${CMANGOS_EXPANSION:-wotlk}:latest
    pull_policy: never
    env_file: .env
    ports:
      - 8085:8085
    volumes:
      - ./databases:/databases
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    entrypoint:
      - "/mangos/bin/mangosd"
    stop_grace_period: 60s
